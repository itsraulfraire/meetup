
name: CI - Meetup Planner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build - Preparar proyecto
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar sintaxis PHP
        run: |
          for carpeta in api apis; do
            if [ -d "$carpeta" ]; then
              find "$carpeta" -type f -name "*.php" \
                -exec php -l {} \;
            else
              echo "Carpeta $carpeta no encontrada, se omite"
            fi
          done

      - name: Preparar Build
        run: |
          mkdir -p build
          cp -r css js build/

          if [ -d img ]; then
            cp -r img build/
          fi

          find . -maxdepth 1 -type f -name "*.html" \
            -exec cp {} build/ \;

      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: meetup-planner-build
          path: build/
          if-no-files-found: error

  testing:
    name: Testing - Validar JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar sintaxis JavaScript
        run: |
          find js -type f -name "*.js" \
            -exec node --check {} \;

      - name: Verificar archivos principales
        run: |
          test -f index.html
          test -d css
          test -d js
          echo "Estructura del proyecto verificada"

      - name: Ejecutar pruebas unitarias
        run: node --test tests/app.test.js
